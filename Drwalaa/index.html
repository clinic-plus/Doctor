<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SESSION_KEY = "clinic_session";
let session = null, stopView = null;

// ---------- المصادقة والشبكة (مشتركة بين كل الشاشات) ----------
async function authCall(grant, body) {
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {method: "POST",
    headers: {apikey: SUPABASE_KEY, "Content-Type": "application/json"}, body: JSON.stringify(body)});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.msg || "فشل الدخول");
  session = {token: d.access_token, refresh: d.refresh_token, exp: Date.now() + (d.expires_in - 120) * 1000};
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
}
async function ensure() { if (Date.now() > session.exp) await authCall("refresh_token", {refresh_token: session.refresh}); }
const hdr = (extra = {}) => ({apikey: SUPABASE_KEY, Authorization: "Bearer " + session.token, ...extra});
async function api(method, path, body, prefer) {
  if (!session) throw new Error("no session");
  await ensure();
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + path, {method, headers: hdr({"Content-Type": "application/json", ...(prefer ? {Prefer: prefer} : {})}), body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { logout(); throw new Error("انتهت الجلسة"); }
  const t = await r.text();
  if (!r.ok) { let m = t; try { m = JSON.parse(t).message || t } catch (e) {} throw new Error(m); }
  return t ? JSON.parse(t) : null;
}
let _lockY = 0, _locked = false;
function lockPage() {
  if (_locked) return; _locked = true;
  _lockY = window.scrollY || document.documentElement.scrollTop || 0;
  const b = document.body; b.style.position = "fixed"; b.style.top = (-_lockY) + "px"; b.style.left = "0"; b.style.right = "0"; b.style.width = "100%"; b.style.overflow = "hidden";
  document.documentElement.style.overscrollBehavior = "none";
}
function unlockPage() {
  if (!_locked) return; _locked = false;
  const b = document.body; b.style.position = b.style.top = b.style.left = b.style.right = b.style.width = b.style.overflow = "";
  document.documentElement.style.overscrollBehavior = ""; window.scrollTo(0, _lockY);
}
function logout(msg) {
  unlockPage(); session = null; localStorage.removeItem(SESSION_KEY);
  if (stopView) { try { stopView(); } catch (e) {} stopView = null; }
  $("wrap").innerHTML = ""; $("login").classList.remove("hidden");
  $("loginMsg").innerHTML = typeof msg === "string" ? `<div class="msg">${esc(msg)}</div>` : "";
}

$("loginBtn").onclick = async () => {
  $("loginMsg").innerHTML = ""; $("loginBtn").disabled = true;
  try { await authCall("password", {email: $("em").value.trim(), password: $("pw").value}); $("pw").value = ""; await start(); }
  catch (e) { $("loginMsg").innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
  $("loginBtn").disabled = false;
};
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });

// ---------- ملفاتي: تسمية وحذف خلال 24 ساعة من الرفع (مشترك بين السكرتيرة والمختبر ووظائف الرئة) ----------
const FILE_TTL_H = 24;
const hoursLeft = r => Math.max(0, FILE_TTL_H - (Date.now() - new Date(r.created_at).getTime()) / 3.6e6);
async function listMine(apptId) {
  const f = apptId ? `&appt_id=eq.${encodeURIComponent(apptId)}` : "";
  return api("GET", `nu_files?select=*&deleted_at=is.null${f}&order=created_at.desc&limit=30`);
}
async function renameFile(id, title) {
  await api("PATCH", "nu_files?id=eq." + encodeURIComponent(id), {title: title.trim()}, "return=minimal");
}
async function deleteFile(r) {
  await api("PATCH", "nu_files?id=eq." + encodeURIComponent(r.id), {deleted_at: new Date().toISOString()}, "return=minimal");
  try { await ensure(); await fetch(`${SUPABASE_URL}/storage/v1/object/nutri-files/${r.storage_path}`, {method: "DELETE", headers: hdr()}); } catch (e) {}
}
async function thumbUrl(r) {
  await ensure();
  const x = await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/nutri-files/${r.storage_path}`, {headers: hdr()});
  if (!x.ok) throw new Error("thumb");
  return URL.createObjectURL(await x.blob());
}
const isPdfFile = r => /\.pdf$/i.test(r.storage_path || "");
function fileRowsHtml(rows, withPatient) {
  if (!rows.length) return '<div class="mut">لا شيء بعد</div>';
  return rows.map(r => {
    const h = hoursLeft(r), left = h >= 1 ? `${Math.floor(h)} س` : `${Math.max(1, Math.round(h * 60))} د`;
    return `<div class="fr" data-fid="${esc(r.id)}"><div class="th" data-th="${esc(r.id)}">${isPdfFile(r) ? "📄" : (thumbCache.has(r.id) ? `<img src="${thumbCache.get(r.id)}" alt="">` : "⏳")}</div>
      <div class="fi"><b>${withPatient ? esc(r.patient_name) + " — " : ""}${esc(r.title || "بدون اسم")}</b>
        <div class="mut">${r.received_at ? "✓ وصل للطبيبة" : "بانتظار الاستلام"} · يتبقى للتعديل ${left}</div></div>
      <div class="fb"><button class="btn soft" data-ren="${esc(r.id)}" type="button">✎</button><button class="btn bad" data-delf="${esc(r.id)}" type="button">🗑️</button></div></div>`;
  }).join("");
}
const thumbCache = new Map();
async function fillThumbs(box, rows) {
  const keep = new Set(rows.map(r => r.id));
  for (const [id, u] of thumbCache) if (!keep.has(id)) { URL.revokeObjectURL(u); thumbCache.delete(id); }
  for (const r of rows) {
    if (isPdfFile(r) || thumbCache.has(r.id)) continue;
    const el = box.querySelector(`[data-th="${r.id}"]`);
    try { const u = await thumbUrl(r); thumbCache.set(r.id, u); if (el) el.innerHTML = `<img src="${u}" alt="">`; } catch (e) { if (el) el.textContent = "🖼️"; }
  }
}
// يربط أزرار ✎ و 🗑️ داخل حاوية؛ after() تُستدعى بعد أي تغيير لإعادة التحميل
function wireFileActions(box, getRows, after, onError) {
  box.onclick = async e => {
    const b = e.target.closest("[data-ren],[data-delf]"); if (!b) return;
    const r = getRows().find(x => x.id === (b.dataset.ren || b.dataset.delf)); if (!r) return;
    try {
      if (b.dataset.ren) {
        const t = prompt("الاسم الجديد للملف", r.title || ""); if (t === null) return;
        await renameFile(r.id, t);
      } else {
        if (!confirm(`حذف الملف «${r.title || "بدون اسم"}»؟ سيُحذف نهائيًا من الإنترنت ومن ملف المريض عند الطبيبة.`)) return;
        await deleteFile(r);
      }
      await after();
    } catch (er) { onError(er.message); }
  };
}

// ---------- توجيه كل حساب لشاشته حسب دوره ----------
const ROUTES = {nutri_secretary: ["tpl-secretary", mountSecretary]};
async function start() {
  await ensure();
  const u = await (await fetch(SUPABASE_URL + "/auth/v1/user", {headers: hdr()})).json();
  const st = await api("GET", "staff?select=role,display_name&user_id=eq." + u.id);
  if (!st.length) return logout("هذا الحساب غير مربوط بدور بعد — تواصل مع الطبيب");
  const role = st[0].role, route = ROUTES[role];
  if (!route) return logout("هذه الصفحة لحساب سكرتيرة د. ولاء فقط. حساب الطبيبة يُستخدم من برنامج العيادة على الحاسبة");
  $("login").classList.add("hidden");
  $("wrap").innerHTML = '<div id="host"></div>';
  const root = $("host").attachShadow({mode: "open"});
  root.appendChild($(route[0]).content.cloneNode(true));
  document.title = "السكرتيرة" + " — عيادة د. ولاء — تغذية علاجية";
  stopView = route[1](root, {id: u.id, role, name: st[0].display_name || ""});
}

// ===================== شاشة السكرتيرة =====================
function mountSecretary(root, me) {
  const $ = id => root.getElementById(id);
  const todayStr = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const nowHM = () => new Date().toTimeString().slice(0, 5);
  const MAX_BYTES = 10 * 1024 * 1024;
  let day = todayStr(), items = [], defaultFee = 15000, devOnline = false;
  let pending = {}, pendCmds = [];
  let timers = [], modalOpen = false;
async function refreshAll() { await loadPending(); await Promise.all([loadStatus(), loadDay()]); }
// حجوزاتي وتعديلاتي التي لم يستلمها جهاز الطبيب بعد (تظهر كبطاقات عادية، وأقدر أعدّلها أو ألغيها)
async function loadPending() {
  try { pendCmds = await api("GET", "nu_commands?select=id,kind,appt_id,payload,created_at&kind=in.(save,checkin,queue)&done_at=is.null&order=created_at.asc"); } catch (e) {}
  renderPend();
}
const isNewPend = c => c.kind === "save" && (c.payload || {}).create === true;
const OVERLAY = {name: "patient_name", date: "appt_date", time: "appt_time", phone: "phone", age: "age", sex: "sex", address: "address", fee: "fee", is_free: "is_free", status: "status"};
function withPending(a) {
  const ps = pendCmds.filter(c => c.appt_id === a.id); if (!ps.length) return a;
  const o = {...a}; for (const c of ps) if (c.kind === "save") for (const k in (c.payload || {})) if (OVERLAY[k]) o[OVERLAY[k]] = k === "inbody" ? JSON.stringify(c.payload[k] || {}) : c.payload[k];
  return o;
}
const getItem = id => { const a = items.find(x => x.id === id); return a ? withPending(a) : null; };
const pendAsAppt = c => { const p = c.payload || {}; return {id: c.appt_id || null, inbody: JSON.stringify(p.inbody || {}), patient_name: p.name || "", appt_date: p.date || day, appt_time: p.time || "", phone: p.phone || "", age: p.age || "", sex: p.sex || "", address: p.address || "", fee: p.fee || 0, is_free: !!p.is_free, status: "مجدول", visit_type: "", queue_order: null, file_count: null, inbody_count: Object.keys(p.inbody || {}).length ? 1 : 0, patient_id: p.patient_id || ""}; };

// الدور «الافتراضي»: يحاكي ما سيفعله برنامج الطبيبة بالطلبات المعلّقة بنفس الترتيب، فيظهر الرقم فورًا حتى لو حاسبتها مطفأة
function virtualQueue() {
  const st = new Map(items.map(a => [a.id, a.queue_order === undefined ? null : a.queue_order]));
  for (const c of pendCmds) if (isNewPend(c) && (c.payload || {}).date === day) st.set(c.appt_id, null);
  const order = () => [...st].filter(([, v]) => v !== null).sort((x, y) => x[1] - y[1]).map(([id]) => id);
  for (const c of pendCmds) {
    if (!st.has(c.appt_id)) continue;
    const id = c.appt_id, p = c.payload || {};
    if (c.kind === "checkin") {
      if (st.get(id) === null) { const vs = [...st.values()].filter(v => v !== null); st.set(id, vs.length ? Math.max(...vs) + 1 : 0); }
    } else if (c.kind === "queue") {
      if (p.action === "clear") st.set(id, null);
      else if (p.action === "up" || p.action === "down") {
        const o = order(), i = o.indexOf(id), j = i + (p.action === "up" ? -1 : 1);
        if (i >= 0 && j >= 0 && j < o.length) { const tmp = st.get(o[i]); st.set(o[i], st.get(o[j])); st.set(o[j], tmp); }
      } else if (p.action === "set") {
        const n = parseInt(p.n, 10), o = order().filter(x => x !== id);
        if (n >= 1 && n <= o.length + 1) { o.splice(n - 1, 0, id); o.forEach((x, i) => st.set(x, i)); }
      }

// ---------- الطلبات (تنفّذ على جهاز الطبيب) ----------
async function send(kind, appt, payload, label) {
  const id = crypto.randomUUID().replaceAll("-", "");
  try {
    await api("POST", "nu_commands", {id, kind, appt_id: appt || null, payload: payload || {}}, "return=minimal");
    pending[id] = {label, appt}; await loadPending(); render(); setTimeout(pollCmds, 600);
  } catch (e) { $("err").innerHTML = `<div class="msg e">تعذّر الإرسال: ${esc(e.message)}</div>`; }
}
function renderPend() {
  const n = new Set([...pendCmds.map(c => c.id), ...Object.keys(pending)]).size;
  $("pend").innerHTML = n ? `<div class="msg w">⏳ ${n} طلب بانتظار التنفيذ على جهاز الطبيب${devOnline ? "" : " — الجهاز غير متصل حاليًا، وسيُنفَّذ أول ما يفتح"}</div>` : "";
}
let polling = false;
async function pollCmds() {
  const ids = Object.keys(pending); if (!ids.length || polling) return;
  polling = true;
  try {
    const rows = await api("GET", `nu_commands?select=id,done_at,ok,message&id=in.(${ids.map(i => '"' + i + '"').join(",")})`);
    let any = false;
    for (const r of rows) if (r.done_at) {
      const p = pending[r.id]; if (!p) continue; delete pending[r.id]; any = true;
      $("err").innerHTML = r.ok ? `<div class="msg s">✅ ${esc(p.label)}</div>` : `<div class="msg e">❌ ${esc(p.label)}: ${esc(r.message || "فشل")}</div>`;
      setTimeout(() => { if (!Object.keys(pending).length) $("err").innerHTML = ""; }, 5000);
    }
    if (any) { await loadPending(); await loadDay(); }
  } catch (e) {} finally { polling = false; }
}

$("list").onclick = e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const card = b.closest(".card"); const f = findCard(card.dataset.id); if (!f) return;
  const a = f.a, pc = f.pc, act = b.dataset.act, vq = virtualQueue(), nm = a.patient_name;
  if (act === "checkin") send("checkin", a.id, {}, `تسجيل حضور ${nm}`);
  else if (act === "up" || act === "down") send("queue", a.id, {action: act}, `تغيير دور ${nm}`);
  else if (act === "qclear") send("queue", a.id, {action: "clear"}, `إلغاء دور ${nm}`);
  else if (act === "qnum") {
    const cur = vq.get(a.id), has = cur !== undefined && cur !== null;
    const others = [...vq.entries()].filter(([id, v]) => v !== null && id !== a.id).length;
    const n = prompt(`رقم الدور لـ ${nm} (من 1 إلى ${others + 1})`, has ? cur + 1 : "");

    send("queue", a.id, {action: "set", n: k}, `رقم دور ${nm}`);
  }
  else if (act === "cancel") { if (pc) cancelPending(pc); else if (confirm(`إلغاء حجز ${nm}؟`)) send("save", a.id, {status: "ملغى"}, `إلغاء حجز ${nm}`); }

      const pv = isNewPend(pc) ? {...v, create: true} : v;
      try {
        const r = await api("PATCH", `nu_commands?id=eq.${encodeURIComponent(pc.id)}&done_at=is.null`, {payload: pv}, "return=representation");
        if (!r || !r.length) { $("fMsg").innerHTML = '<div class="msg w">استلمته الطبيبة قبل لحظات — أغلق هذه النافذة وعدّله من بطاقته</div>'; return; }
      } catch (e) { $("fMsg").innerHTML = `<div class="msg e">${esc(e.message)}</div>`; return; }
      closeModal(); if (v.date !== day) { day = v.date; $("day").value = day; }
      await loadPending(); await loadDay(); return;
    }
    let payload = v;
    if (a) {   // تعديل: نرسل الحقول التي تغيّرت فقط
      const cur = {name: a.patient_name, date: a.appt_date, time: a.appt_time, phone: a.phone, age: a.age, sex: a.sex || "", address: a.address, is_free: a.is_free, fee: a.fee, inbody: JSON.stringify(parseIb(a.inbody))};
      const cmp = {...v, inbody: JSON.stringify(v.inbody)};
      payload = {}; for (const k in v) if (String(cmp[k]) !== String(cur[k])) payload[k] = v[k];
      if (!Object.keys(payload).length) { closeModal(); return; }
    } else payload = {...v, create: true};      // حجز جديد: المعرّف جاهز مسبقًا لتتمكن من الملفات والحضور والدور قبل الاستلام
    closeModal();
    send("save", a ? a.id : newId, payload, (a ? "تعديل حجز " : "حجز جديد: ") + v.name);
    if (!a && v.date !== day) { day = v.date; $("day").value = day; }
  };
  // Enter يحفظ من أي حقل
  $("box").onkeydown = e => { if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "checkbox") { e.preventDefault(); $("fSave").click(); } };
  setTimeout(() => { const f = $("fName"); if (f) f.focus(); }, 100);
}
$("addBtn").onclick = () => openForm(null);

// ---------- ملفات الموعد (عرض الأسماء + رفع) ----------
let upFiles = [];
async function openFiles(a) {
  upFiles = [];
  openModal(`<h3 style="margin-top:0;color:var(--pri-d)">📎 ملفات ${esc(a.patient_name)}</h3>
    <div class="mut">الملفات ونتائج InBody اللي وصلت للطبيبة (أسماؤها فقط) — راجعها قبل الرفع حتى لا تتكرر.</div>
    <div id="fl" style="margin:8px 0"><div class="mut">جارِ التحميل...</div></div>
    <div class="card" style="margin-top:10px"><b>ملفاتي لهذا الموعد (آخر 24 ساعة)</b>
      <div class="mut" style="margin-top:2px">تعدّل الاسم أو تحذف خلال 24 ساعة من الرفع، وبعدها يُحذف من الخادم.</div>
      <div id="mineF" class="files"><div class="mut">لا شيء بعد</div></div></div>
    <div class="card" style="margin-top:10px"><b>رفع ملفات</b>
      <div class="row" id="chips" style="margin:8px 0"></div>
      <div class="row" style="margin:6px 0"><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="radio" name="upKind" value="file" checked style="width:auto"> ملف عادي</label>
        <label style="display:flex;gap:6px;align-items:center;margin:0"><input type="radio" name="upKind" value="inbody" style="width:auto"> 📊 نتيجة InBody</label></div>
      <input id="upTitle" placeholder="اسم الملف (مثال: تحليل دم)">
      <div class="row" style="margin-top:8px"><button class="btn soft" id="camB">📷 تصوير</button><button class="btn soft" id="galB">🖼️ معرض / PDF</button></div>
      <input id="camI" type="file" accept="image/*" capture="environment" class="hidden"><input id="galI" type="file" accept="image/*,application/pdf" multiple class="hidden">
      <div id="picked" class="mut" style="margin-top:6px"></div><div id="upMsg"></div>
      <button class="btn ok big" id="upGo" style="margin-top:8px" disabled>⬆️ رفع</button></div>
    <div class="row stickyrow" style="margin-top:10px"><button class="btn soft" id="fRef">🔄 تحديث</button><span class="sp"></span><button class="btn soft" id="fClose">إغلاق</button></div>`);
  $("fClose").onclick = closeModal;
  const load = async () => { try {
    const rows = await api("GET", `nu_appt_files_meta?select=*&appt_id=eq.${a.id}&order=uploaded_at.desc`);
    $("fl").innerHTML = rows.length ? rows.map(r => `<div class="frow">📄 ${esc(r.title || "بدون اسم")} <span class="mut">${new Date(r.uploaded_at).toLocaleString("ar-IQ", {hour: "2-digit", minute: "2-digit", day: "numeric", month: "numeric"})}</span></div>`).join("") : '<div class="mut">لا توجد ملفات لهذا الموعد بعد</div>';
  } catch (e) { $("fl").innerHTML = `<div class="msg e">${esc(e.message)}</div>`; } };
  let mineF = [];
  const loadMineF = async () => { try { mineF = await listMine(a.id); $("mineF").innerHTML = fileRowsHtml(mineF, false); fillThumbs($("mineF"), mineF); } catch (e) {} };
  wireFileActions($("mineF"), () => mineF, async () => { await loadMineF(); await load(); }, m => { $("upMsg").innerHTML = `<div class="msg e">${esc(m)}</div>`; });
  load(); loadMineF(); $("fRef").onclick = () => { load(); loadMineF(); };
  $("chips").innerHTML = ["InBody", "تحليل دم", "تحليل ادرار", "أشعة", "تقرير"].map(c => `<button class="chip" type="button">${c}</button>`).join("");
  $("chips").onclick = e => { if (e.target.classList.contains("chip")) { $("upTitle").value = e.target.textContent; if (e.target.textContent === "InBody") root.querySelector('input[name="upKind"][value="inbody"]').checked = true; } };
  const upd = () => { $("picked").innerHTML = upFiles.map((f, i) => `• ${esc(f.name)} <a href="#" data-rm="${i}" style="color:var(--bad)">حذف</a>`).join("<br>"); $("upGo").disabled = !upFiles.length; };
  $("picked").onclick = e => { if (e.target.dataset.rm !== undefined) { e.preventDefault(); upFiles.splice(+e.target.dataset.rm, 1); upd(); } };
  $("camB").onclick = () => $("camI").click(); $("galB").onclick = () => $("galI").click();
  for (const id of ["camI", "galI"]) $(id).onchange = e => { upFiles = upFiles.concat([...e.target.files]); e.target.value = ""; upd(); };
  $("upGo").onclick = async () => {
    $("upGo").disabled = true; const title = $("upTitle").value.trim() || (root.querySelector('input[name="upKind"]:checked').value === "inbody" ? "InBody" : ""); const kind = root.querySelector('input[name="upKind"]:checked').value; let ok = 0;
    try {
      for (const [i, f] of upFiles.entries()) {
        $("upMsg").innerHTML = `<div class="msg s">جاري رفع ${i + 1} من ${upFiles.length}...</div>`;
        const {blob, ext, type} = await shrink(f);
        if (blob.size > MAX_BYTES) throw new Error(`الملف أكبر من 10 ميغا: ${f.name}`);
        const fid = crypto.randomUUID().replaceAll("-", ""), path = `${me.id}/${fid}${ext}`;
        await ensure();
        const r = await fetch(`${SUPABASE_URL}/storage/v1/object/nutri-files/${path}`, {method: "POST", headers: hdr({"Content-Type": type}), body: blob});
        if (!r.ok) throw new Error("فشل رفع الملف: " + (await r.text()));
        await api("POST", "nu_files", {id: fid, appt_id: a.id, title, kind, storage_path: path, size_bytes: blob.size}, "return=minimal");
        ok++;
      }
      $("upMsg").innerHTML = `<div class="msg s">✅ تم رفع ${ok} ملف — يظهر بالقائمة بعد استلام الطبيب (اضغط تحديث)</div>`;
      upFiles = []; $("upTitle").value = ""; upd(); loadMineF();
    } catch (e) { $("upMsg").innerHTML = `<div class="msg e">${esc(e.message)}${ok ? ` (تم رفع ${ok} قبل الخطأ)` : ""}</div>`; upFiles = upFiles.slice(ok); upd(); loadMineF(); }
  };
}
async function shrink(f) {
  if (f.type === "application/pdf") return {blob: f, ext: ".pdf", type: "application/pdf"};
  const bmp = await createImageBitmap(f).catch(() => null);
  if (!bmp) throw new Error(`تعذّر قراءة الصورة: ${f.name}`);
  const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return {blob: await new Promise(r => c.toBlob(r, "image/jpeg", 0.82)), ext: ".jpg", type: "image/jpeg"};
}


  $("logout").onclick = logout;
  $("day").value = day;
  refreshAll();
  timers = [setInterval(() => { if (!modalOpen) refreshAll(); else loadStatus(); }, 4000), setInterval(pollCmds, 1000)];
  return () => timers.forEach(clearInterval);
}
