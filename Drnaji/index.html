<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SESSION_KEY = "clinic_session";
let session = null, stopView = null;

// ---------- المصادقة والشبكة (مشتركة بين كل الشاشات) ----------
async function authCall(grant, body) {
  const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {method: "POST",
    headers: {apikey: SUPABASE_KEY, "Content-Type": "application/json"}, body: JSON.stringify(body)});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.msg || "فشل الدخول");
  session = {token: d.access_token, refresh: d.refresh_token, exp: Date.now() + (d.expires_in - 120) * 1000};
  localStorage.setItem(SESSION_KEY, JSON.stringify(session));
}
async function ensure() { if (Date.now() > session.exp) await authCall("refresh_token", {refresh_token: session.refresh}); }
const hdr = (extra = {}) => ({apikey: SUPABASE_KEY, Authorization: "Bearer " + session.token, ...extra});
async function api(method, path, body, prefer) {
  if (!session) throw new Error("no session");
  await ensure();
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + path, {method, headers: hdr({"Content-Type": "application/json", ...(prefer ? {Prefer: prefer} : {})}), body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { logout(); throw new Error("انتهت الجلسة"); }
  const t = await r.text();
  if (!r.ok) { let m = t; try { m = JSON.parse(t).message || t } catch (e) {} throw new Error(m); }
  return t ? JSON.parse(t) : null;
}
function logout(msg) {
  session = null; localStorage.removeItem(SESSION_KEY);
  if (stopView) { try { stopView(); } catch (e) {} stopView = null; }
  $("wrap").innerHTML = ""; $("login").classList.remove("hidden");
  $("loginMsg").innerHTML = typeof msg === "string" ? `<div class="msg">${esc(msg)}</div>` : "";
}

$("loginBtn").onclick = async () => {
  $("loginMsg").innerHTML = ""; $("loginBtn").disabled = true;
  try { await authCall("password", {email: $("em").value.trim(), password: $("pw").value}); $("pw").value = ""; await start(); }
  catch (e) { $("loginMsg").innerHTML = `<div class="msg">${esc(e.message)}</div>`; }
  $("loginBtn").disabled = false;
};
$("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });

// ---------- ملفاتي: تسمية وحذف خلال 24 ساعة من الرفع (مشترك بين السكرتيرة والمختبر ووظائف الرئة) ----------
const FILE_TTL_H = 24;
const hoursLeft = r => Math.max(0, FILE_TTL_H - (Date.now() - new Date(r.created_at).getTime()) / 3.6e6);
async function listMine(apptId) {

async function renameFile(id, title) {

}
async function deleteFile(r) {
  await api("PATCH", "incoming_files?id=eq." + encodeURIComponent(r.id), {deleted_at: new Date().toISOString()}, "return=minimal");
  try { await ensure(); await fetch(`${SUPABASE_URL}/storage/v1/object/clinic-files/${r.storage_path}`, {method: "DELETE", headers: hdr()}); } catch (e) {}

async function thumbUrl(r) {
  await ensure();
  const x = await fetch(`${SUPABASE_URL}/storage/v1/object/authenticated/clinic-files/${r.storage_path}`, {headers: hdr()});
  if (!x.ok) throw new Error("thumb");
  return URL.createObjectURL(await x.blob());
}
const isPdfFile = r => /\.pdf$/i.test(r.storage_path || "");
function fileRowsHtml(rows, withPatient) {
  if (!rows.length) return '<div class="mut">لا شيء بعد</div>';
  return rows.map(r => {
    const h = hoursLeft(r), left = h >= 1 ? `${Math.floor(h)} س` : `${Math.max(1, Math.round(h * 60))} د`;
    return `<div class="fr" data-fid="${esc(r.id)}"><div class="th" data-th="${esc(r.id)}">${isPdfFile(r) ? "📄" : (thumbCache.has(r.id) ? `<img src="${thumbCache.get(r.id)}" alt="">` : "⏳")}</div>
      <div class="fi"><b>${withPatient ? esc(r.patient_name) + " — " : ""}${esc(r.title || "بدون اسم")}</b>
        <div class="mut">${r.received_at ? "✓ وصل للطبيب" : "بانتظار الاستلام"} · يتبقى للتعديل ${left}</div></div>
      <div class="fb"><button class="btn soft" data-ren="${esc(r.id)}" type="button">✎</button><button class="btn bad" data-delf="${esc(r.id)}" type="button">🗑️</button></div></div>`;
  }).join("");
}
const thumbCache = new Map();
async function fillThumbs(box, rows) {
  const keep = new Set(rows.map(r => r.id));
  for (const [id, u] of thumbCache) if (!keep.has(id)) { URL.revokeObjectURL(u); thumbCache.delete(id); }
  for (const r of rows) {
    if (isPdfFile(r) || thumbCache.has(r.id)) continue;
    const el = box.querySelector(`[data-th="${r.id}"]`);
    try { const u = await thumbUrl(r); thumbCache.set(r.id, u); if (el) el.innerHTML = `<img src="${u}" alt="">`; } catch (e) { if (el) el.textContent = "🖼️"; }
  }
}
// يربط أزرار ✎ و 🗑️ داخل حاوية؛ after() تُستدعى بعد أي تغيير لإعادة التحميل
function wireFileActions(box, getRows, after, onError) {
  box.onclick = async e => {
    const b = e.target.closest("[data-ren],[data-delf]"); if (!b) return;
    const r = getRows().find(x => x.id === (b.dataset.ren || b.dataset.delf)); if (!r) return;
    try {
      if (b.dataset.ren) {
        const t = prompt("الاسم الجديد للملف", r.title || ""); if (t === null) return;
        await renameFile(r.id, t);
      } else {
        if (!confirm(`حذف الملف «${r.title || "بدون اسم"}»؟ سيُحذف نهائيًا من الإنترنت ومن ملف المريض عند الطبيب.`)) return;
        await deleteFile(r);
      }
      await after();
    } catch (er) { onError(er.message); }
  };
}

// تصغير الصور قبل الرفع (يسرّع الرفع ويوفر التخزين)
async function shrink(f) {
  if (f.type === "application/pdf") return {blob: f, ext: ".pdf", type: "application/pdf"};
  const bmp = await createImageBitmap(f).catch(() => null);
  if (!bmp) throw new Error(`تعذّر قراءة الصورة: ${f.name}`);
  const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
  return {blob, ext: ".jpg", type: "image/jpeg"};
}

      return `<div class="card" data-pc="${esc(x.c.id)}"><div class="row"><span class="nm">${esc(p.name)}</span><span class="sp"></span><span class="bd e">⏳ بانتظار استلام الطبيب</span></div>
        <div class="row mut" style="margin-top:6px;gap:14px"><span>${p.phone ? "📞 " + esc(p.phone) : "📞 —"}</span><span>🕐 ${esc(p.time)}</span>
        <span>${p.is_free ? "🆓 كشفية مجانية" : "💵 " + Number(p.fee || 0).toLocaleString("en-US") + " د.ع"}</span></div>
        <div class="acts"><button class="btn soft" data-act="pedit">✎ تعديل</button><button class="btn bad" data-act="pcancel">🚫 إلغاء الحجز</button></div></div>`;
    }
    const a = x.a, cancelled = a.status === "ملغى", queued = a.queue_order !== null, busy = busyIds.has(a.id) || pendCmds.some(c => c.appt_id === a.id);
    let h = `<div class="card ${cancelled ? "cx" : ""}" data-id="${esc(a.id)}"><div class="row">`;
    if (queued) h += `<button class="qn" data-act="qnum">${a.queue_order + 1}</button>`;
    h += `<span class="nm">${esc(a.patient_name)}</span>${a.visit_type === "new" ? '<span class="bd n">جديد</span>' : ""}<span class="sp"></span>
      ${busy ? '<span class="bd e">⏳</span>' : ""}<span class="bd ${stCls(a.status)}">${esc(a.status)}</span></div>`;
    h += `<div class="row mut" style="margin-top:6px;gap:14px"><span>${a.phone ? `📞 <a href="tel:${esc(a.phone)}">${esc(a.phone)}</a>` : "📞 —"}</span><span>🕐 ${esc(a.appt_time)}</span>
      <span>${a.is_free ? "🆓 كشفية مجانية" : "💵 " + Number(a.fee).toLocaleString("en-US") + " د.ع"}</span></div>`;
    if (a.rx) h += `<div class="mut" style="margin-top:4px">${a.rx === "ready" ? "💊 تم تجهيز العلاج من الصيدلية" : "💊 الوصفة بانتظار الصيدلية"}</div>`;
    h += '<div class="acts">';
    if (!cancelled) {
      if (queued) h += '<button class="btn soft" data-act="up">⬆ تقديم</button><button class="btn soft" data-act="down">⬇ تأخير</button><button class="btn soft" data-act="qnum">🔢 رقم الدور</button><button class="btn soft" data-act="qclear">↩ إلغاء الدور</button>';
      else h += '<button class="btn ok" data-act="checkin">✅ تسجيل حضور</button><button class="btn soft" data-act="qnum">🔢 رقم الدور</button>';
    }
    h += `<button class="btn soft" data-act="edit">✎ تعديل</button><button class="btn soft" data-act="files">📎 الملفات (${a.file_count})</button>`;
    if (a.status === "مجدول") h += '<button class="btn bad" data-act="cancel">🚫 إلغاء الحجز</button>';
    if (cancelled) h += '<button class="btn soft" data-act="restore">↩ استرجاع الحجز</button>';
    return h + "</div></div>";
  }).join("");
}
$("q").oninput = render;
$("day").onchange = () => { if ($("day").value) { day = $("day").value; loadDay(); } };
$("prev").onclick = () => shift(-1); $("next").onclick = () => shift(1);
$("today").onclick = () => { day = todayStr(); $("day").value = day; loadDay(); };
function shift(n) { const d = new Date(day + "T12:00:00"); d.setDate(d.getDate() + n); day = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); $("day").value = day; loadDay(); }

// ---------- الطلبات (تنفّذ على جهاز الطبيب) ----------
async function send(kind, appt, payload, label) {
  const id = crypto.randomUUID().replaceAll("-", "");
  try {
    await api("POST", "appt_commands", {id, kind, appt_id: appt || null, payload: payload || {}}, "return=minimal");
    pending[id] = {label, appt}; await loadPending(); render(); setTimeout(pollCmds, 600);
  } catch (e) { $("err").innerHTML = `<div class="msg e">تعذّر الإرسال: ${esc(e.message)}</div>`; }
}
function renderPend() {
  const n = new Set([...pendCmds.map(c => c.id), ...Object.keys(pending)]).size;
  $("pend").innerHTML = n ? `<div class="msg w">⏳ ${n} طلب بانتظار التنفيذ على جهاز الطبيب${devOnline ? "" : " — الجهاز غير متصل حاليًا، وسيُنفَّذ أول ما يفتح"}</div>` : "";
}
let polling = false;
async function pollCmds() {
  const ids = Object.keys(pending); if (!ids.length || polling) return;
  polling = true;
  try {
    const rows = await api("GET", `appt_commands?select=id,done_at,ok,message&id=in.(${ids.map(i => '"' + i + '"').join(",")})`);
    let any = false;
    for (const r of rows) if (r.done_at) {
      const p = pending[r.id]; if (!p) continue; delete pending[r.id]; any = true;
      $("err").innerHTML = r.ok ? `<div class="msg s">✅ ${esc(p.label)}</div>` : `<div class="msg e">❌ ${esc(p.label)}: ${esc(r.message || "فشل")}</div>`;
      setTimeout(() => { if (!Object.keys(pending).length) $("err").innerHTML = ""; }, 5000);
    }
    if (any) { await loadPending(); await loadDay(); }
  } catch (e) {} finally { polling = false; }
}

$("list").onclick = e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const pcEl = b.closest("[data-pc]");
  if (pcEl) { const c = pendCmds.find(x => x.id === pcEl.dataset.pc); if (!c) return;
    if (b.dataset.act === "pedit") openForm(pendAsAppt(c), c); else if (b.dataset.act === "pcancel") cancelPending(c); return; }
  const card = b.closest(".card"); const a = getItem(card.dataset.id); if (!a) return;
  const act = b.dataset.act;
  if (act === "checkin") send("checkin", a.id, {}, `تسجيل حضور ${a.patient_name}`);
  else if (act === "up" || act === "down") send("queue", a.id, {action: act}, `تغيير دور ${a.patient_name}`);
  else if (act === "qclear") send("queue", a.id, {action: "clear"}, `إلغاء دور ${a.patient_name}`);
  else if (act === "qnum") { const n = prompt("رقم الدور الجديد لـ " + a.patient_name, a.queue_order !== null ? a.queue_order + 1 : ""); if (n) send("queue", a.id, {action: "set", n: parseInt(n, 10)}, `رقم دور ${a.patient_name}`); }
  else if (act === "cancel") { if (confirm(`إلغاء حجز ${a.patient_name}؟`)) send("save", a.id, {status: "ملغى"}, `إلغاء حجز ${a.patient_name}`); }
  else if (act === "restore") send("save", a.id, {status: "مجدول"}, `استرجاع حجز ${a.patient_name}`);
  else if (act === "edit") openForm(a);
  else if (act === "files") openFiles(a);
};

// ---------- إلغاء حجز لم يستلمه الطبيب بعد ----------
async function cancelPending(c) {
  const nm = (c.payload || {}).name || "";
  if (!confirm(`إلغاء حجز ${nm}؟ لم يستلمه الطبيب بعد فيُحذف بدون أثر.`)) return;
  try {
    const r = await api("DELETE", `appt_commands?id=eq.${encodeURIComponent(c.id)}&done_at=is.null`, null, "return=representation");
    delete pending[c.id];
    $("err").innerHTML = r && r.length ? '<div class="msg s">✅ أُلغي الحجز قبل استلام الطبيب</div>' : '<div class="msg w">استلمه الطبيب قبل لحظات — ألغِه من بطاقته بعد ظهورها</div>';
    setTimeout(() => { if (!Object.keys(pending).length) $("err").innerHTML = ""; }, 5000);
    await loadPending(); await loadDay();
  } catch (e) { $("err").innerHTML = `<div class="msg e">تعذّر الإلغاء: ${esc(e.message)}</div>`; }
}

// ---------- نافذة الحجز ----------
function openModal(html) { $("box").innerHTML = html; $("modal").classList.remove("hidden"); modalOpen = true; }
function closeModal() { $("modal").classList.add("hidden"); modalOpen = false; devHook = null; $("box").innerHTML = ""; }
let devHook = null;
// a = موعد للتعديل (أو null لحجز جديد)، pc = طلب حجز معلّق لم يستلمه الطبيب (تعديله قبل الاستلام)
function openForm(a, pc) {
  openModal(`<h3 style="margin-top:0;color:var(--pri-d)">${a ? "تعديل حجز" : "حجز جديد"}</h3>
    <label>الاسم *</label>
    <input id="fName" value="${esc(a?.patient_name)}" autocomplete="off">
    <div id="devWarn" class="warnline"></div>
    <div class="g2"><div><label>التاريخ *</label><input id="fDate" type="date" value="${esc(a?.appt_date || day)}"></div>
      <div><label>الوقت *</label><input id="fTime" type="time" value="${esc(a?.appt_time || nowHM())}"></div></div>
    <div class="g2"><div><label>رقم الهاتف</label><input id="fPhone" type="tel" value="${esc(a?.phone)}"></div>
      <div><label>العمر</label><input id="fAge" inputmode="numeric" value="${esc(a?.age)}"></div></div>
    <label>العنوان</label><input id="fAddr" value="${esc(a?.address)}">
    <label>سعر الكشفية (د.ع)</label><input id="fFee" type="number" inputmode="numeric" step="500" value="${a ? a.fee : defaultFee}">
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fFree" style="width:auto" ${a?.is_free ? "checked" : ""}> كشفية مجانية</label>
    <div id="fMsg"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="fSave" style="flex:1">${a ? "حفظ التعديل" : "حفظ الحجز"}</button><button class="btn soft" id="fCancel">إلغاء</button></div>`);
  $("fCancel").onclick = closeModal;
  const free = () => { $("fFee").disabled = $("fFree").checked; if ($("fFree").checked) $("fFee").value = 0; };
  $("fFree").onchange = free; free();
  // حالة حاسبة الطبيب: نشطة (أخضر) أو غير نشطة (أحمر) — الحجز يبقى متاحًا ويُنفَّذ لاحقًا
  const paintDev = () => {
    const w = $("devWarn"); if (!w) return;
    w.className = devOnline ? "okline" : "warnline";
    w.textContent = devOnline ? "🟢 حاسبة الطبيب نشطة" : "🔴 حاسبة الطبيب غير نشطة — يُنفَّذ الحجز أول ما تفتح";
  };
  devHook = paintDev; paintDev();
  $("fSave").onclick = async () => {
    const v = {name: $("fName").value.trim(), date: $("fDate").value, time: $("fTime").value, phone: $("fPhone").value.trim(),
      age: $("fAge").value.trim(), address: $("fAddr").value.trim(), is_free: $("fFree").checked, fee: $("fFree").checked ? 0 : Number($("fFee").value || 0)};
    if (!v.name) { $("fMsg").innerHTML = '<div class="msg e">الاسم مطلوب</div>'; return; }
    if (!v.date || !v.time) { $("fMsg").innerHTML = '<div class="msg e">التاريخ والوقت مطلوبان</div>'; return; }
    if (pc) {   // تعديل حجز لم يستلمه الطبيب: نبدّل محتوى الطلب نفسه
      try {
        const r = await api("PATCH", `appt_commands?id=eq.${encodeURIComponent(pc.id)}&done_at=is.null`, {payload: v}, "return=representation");
        if (!r || !r.length) { $("fMsg").innerHTML = '<div class="msg w">استلمه الطبيب قبل لحظات — أغلق هذه النافذة وعدّله من بطاقته</div>'; return; }
      } catch (e) { $("fMsg").innerHTML = `<div class="msg e">${esc(e.message)}</div>`; return; }
      closeModal(); if (v.date !== day) { day = v.date; $("day").value = day; }
      await loadPending(); await loadDay(); return;
    }
    let payload = v;
    if (a) {   // تعديل: نرسل الحقول التي تغيّرت فقط
      const cur = {name: a.patient_name, date: a.appt_date, time: a.appt_time, phone: a.phone, age: a.age, address: a.address, is_free: a.is_free, fee: a.fee};
      payload = {}; for (const k in v) if (String(v[k]) !== String(cur[k])) payload[k] = v[k];
      if (!Object.keys(payload).length) { closeModal(); return; }
    }
    closeModal();
    send("save", a ? a.id : null, payload, (a ? "تعديل حجز " : "حجز جديد: ") + v.name);
    if (!a && v.date !== day) { day = v.date; $("day").value = day; }
  };
  // Enter يحفظ من أي حقل
  $("box").onkeydown = e => { if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "checkbox") { e.preventDefault(); $("fSave").click(); } };
  setTimeout(() => $("fName").focus(), 100);
}
$("addBtn").onclick = () => openForm(null);

// ---------- ملفات الموعد (عرض الأسماء + رفع) ----------
let upFiles = [];
async function openFiles(a) {
  upFiles = [];
  openModal(`<h3 style="margin-top:0;color:var(--pri-d)">📎 ملفات ${esc(a.patient_name)}</h3>
    <div class="mut">الملفات اللي وصلت للطبيب (أسماؤها فقط) — راجعها قبل الرفع حتى لا تتكرر.</div>
    <div id="fl" style="margin:8px 0"><div class="mut">جارِ التحميل...</div></div>
    <div class="card" style="margin-top:10px"><b>ملفاتي لهذا الموعد (آخر 24 ساعة)</b>
      <div class="mut" style="margin-top:2px">تعدّل الاسم أو تحذف خلال 24 ساعة من الرفع، وبعدها يُحذف من الخادم.</div>
      <div id="mineF" class="files"><div class="mut">لا شيء بعد</div></div></div>
    <div class="card" style="margin-top:10px"><b>رفع ملفات</b>
      <div class="row" id="chips" style="margin:8px 0"></div>
      <input id="upTitle" placeholder="اسم الملف (مثال: تحليل دم)">
      <div class="row" style="margin-top:8px"><button class="btn soft" id="camB">📷 تصوير</button><button class="btn soft" id="galB">🖼️ معرض / PDF</button></div>
      <input id="camI" type="file" accept="image/*" capture="environment" class="hidden"><input id="galI" type="file" accept="image/*,application/pdf" multiple class="hidden">
      <div id="picked" class="mut" style="margin-top:6px"></div><div id="upMsg"></div>
      <button class="btn ok big" id="upGo" style="margin-top:8px" disabled>⬆️ رفع</button></div>
    <div class="row" style="margin-top:10px"><button class="btn soft" id="fRef">🔄 تحديث</button><span class="sp"></span><button class="btn soft" id="fClose">إغلاق</button></div>`);
  $("fClose").onclick = closeModal;
  const load = async () => { try {
    const rows = await api("GET", `appt_files_meta?select=*&appt_id=eq.${a.id}&order=uploaded_at.desc`);
    $("fl").innerHTML = rows.length ? rows.map(r => `<div class="frow">📄 ${esc(r.title || "بدون اسم")} <span class="mut">${new Date(r.uploaded_at).toLocaleString("ar-IQ", {hour: "2-digit", minute: "2-digit", day: "numeric", month: "numeric"})}</span></div>`).join("") : '<div class="mut">لا توجد ملفات لهذا الموعد بعد</div>';
  } catch (e) { $("fl").innerHTML = `<div class="msg e">${esc(e.message)}</div>`; } };
  let mineF = [];
  const loadMineF = async () => { try { mineF = await listMine(a.id); $("mineF").innerHTML = fileRowsHtml(mineF, false); fillThumbs($("mineF"), mineF); } catch (e) {} };
  wireFileActions($("mineF"), () => mineF, async () => { await loadMineF(); await load(); }, m => { $("upMsg").innerHTML = `<div class="msg e">${esc(m)}</div>`; });
  load(); loadMineF(); $("fRef").onclick = () => { load(); loadMineF(); };
  $("chips").innerHTML = ["تحليل دم", "تحليل ادرار", "أشعة", "تقرير", "فحص وظائف الرئة"].map(c => `<button class="chip" type="button">${c}</button>`).join("");
  $("chips").onclick = e => { if (e.target.classList.contains("chip")) $("upTitle").value = e.target.textContent; };
  const upd = () => { $("picked").innerHTML = upFiles.map((f, i) => `• ${esc(f.name)} <a href="#" data-rm="${i}" style="color:var(--bad)">حذف</a>`).join("<br>"); $("upGo").disabled = !upFiles.length; };
  $("picked").onclick = e => { if (e.target.dataset.rm !== undefined) { e.preventDefault(); upFiles.splice(+e.target.dataset.rm, 1); upd(); } };
  $("camB").onclick = () => $("camI").click(); $("galB").onclick = () => $("galI").click();
  for (const id of ["camI", "galI"]) $(id).onchange = e => { upFiles = upFiles.concat([...e.target.files]); e.target.value = ""; upd(); };
  $("upGo").onclick = async () => {
    $("upGo").disabled = true; const title = $("upTitle").value.trim(); let ok = 0;
    try {
      for (const [i, f] of upFiles.entries()) {
        $("upMsg").innerHTML = `<div class="msg s">جاري رفع ${i + 1} من ${upFiles.length}...</div>`;
        const {blob, ext, type} = await shrink(f);
        if (blob.size > MAX_BYTES) throw new Error(`الملف أكبر من 10 ميغا: ${f.name}`);
        const fid = crypto.randomUUID().replaceAll("-", ""), path = `${me.id}/${fid}${ext}`;
        await ensure();
        const r = await fetch(`${SUPABASE_URL}/storage/v1/object/clinic-files/${path}`, {method: "POST", headers: hdr({"Content-Type": type}), body: blob});
        if (!r.ok) throw new Error("فشل رفع الملف: " + (await r.text()));
        await api("POST", "incoming_files", {id: fid, appt_id: a.id, title, storage_path: path, size_bytes: blob.size}, "return=minimal");
        ok++;
      }
      $("upMsg").innerHTML = `<div class="msg s">✅ تم رفع ${ok} ملف — يظهر بالقائمة بعد استلام الطبيب (اضغط تحديث)</div>`;
      upFiles = []; $("upTitle").value = ""; upd(); loadMineF();
    } catch (e) { $("upMsg").innerHTML = `<div class="msg e">${esc(e.message)}${ok ? ` (تم رفع ${ok} قبل الخطأ)` : ""}</div>`; upFiles = upFiles.slice(ok); upd(); loadMineF(); }
  };
}
async function shrink(f) {
  if (f.type === "application/pdf") return {blob: f, ext: ".pdf", type: "application/pdf"};
  const bmp = await createImageBitmap(f).catch(() => null);
  if (!bmp) throw new Error(`تعذّر قراءة الصورة: ${f.name}`);
  const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return {blob: await new Promise(r => c.toBlob(r, "image/jpeg", 0.82)), ext: ".jpg", type: "image/jpeg"};
}


  $("logout").onclick = logout;
  $("day").value = day;
  refreshAll();
  timers = [setInterval(() => { if (!modalOpen) refreshAll(); else loadStatus(); }, 4000), setInterval(pollCmds, 1000)];
  return () => timers.forEach(clearInterval);
}

// ---------- استعادة الجلسة ----------
(async () => {
  if (SUPABASE_URL.startsWith("PASTE") || SUPABASE_KEY.startsWith("PASTE")) { logout("الصفحة غير مُعدّة بعد (المفتاح ناقص)"); return; }
  try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) {}
  if (session) { try { await start(); } catch (e) { logout(); } }
})();
